<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Detail Admin · Play List N</title>
  <link rel="icon" type="image/png" href="admin-favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=6"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#060807;color:#f4f8f6;font-family:Inter,system-ui,sans-serif}button,input{font:inherit}
    .shell{width:min(920px,calc(100% - 28px));margin:0 auto;padding:30px 0 70px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.back{color:#b9c8c1;text-decoration:none}.back:hover{color:#00e786}
    .brand{color:#00e786;font-weight:950;letter-spacing:-.03em}.card{padding:22px;border:1px solid #263a34;border-radius:20px;background:linear-gradient(145deg,#101815,#090d0c);box-shadow:0 20px 70px #0007}.hidden{display:none!important}
    h1{margin:0;font-size:clamp(25px,5vw,38px);letter-spacing:-.04em}.subtitle{margin:6px 0 0;color:#82938b;font-size:13px}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0}.stat{padding:14px;border:1px solid #273b34;border-radius:14px;background:#0b1311}.stat small{display:block;color:#71827b;font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.09em}.stat b{display:block;margin-top:7px;overflow-wrap:anywhere}
    .section{margin-top:14px}.section h2{margin:0 0 5px;font-size:17px}.help{margin:0 0 16px;color:#82938b;font-size:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:7px;color:#b9c5c0;font-size:12px;font-weight:750}.field input{width:100%;padding:12px;border:1px solid #2a3b35;border-radius:11px;background:#080c0b;color:#fff;outline:0}.field input:focus{border-color:#00dc7c;box-shadow:0 0 0 4px #00dc7c17}
    .permissions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.permission{display:flex;align-items:flex-start;gap:10px;min-height:78px;padding:13px;border:1px solid #263a34;border-radius:12px;background:#0d1714;cursor:pointer}.permission:hover{border-color:#31594b}.permission input{margin-top:3px;accent-color:#00dc7c}.permission b{display:block;font-size:12px}.permission small{display:block;margin-top:4px;color:#82928c;font-size:11px;line-height:1.4}
    .actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.btn{padding:11px 16px;border:1px solid transparent;border-radius:11px;cursor:pointer;font-weight:850;text-decoration:none}.primary{background:linear-gradient(135deg,#00ec84,#00b968);color:#03130b}.ghost{background:#18201e;color:#dce6e2;border-color:#2b3935}.notice{margin-top:14px;padding:12px 14px;border:1px solid #285044;border-radius:12px;background:#0c1a16;color:#9effd1}.error{border-color:#74313a;background:#251116;color:#ffabb3}
    @media(max-width:650px){.summary,.fields,.permissions{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.actions{flex-direction:column}.actions .btn{text-align:center;width:100%}.card{padding:17px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><a class="back" href="admin.html">← Kembali ke Daftar Admin</a><div class="brand">PLAY LIST N</div></header>
    <div id="loading" class="card">Memuat data admin…</div>
    <div id="error" class="card notice error hidden"></div>
    <div id="content" class="hidden">
      <section class="card">
        <h1 id="adminName">Detail Admin</h1><p id="adminEmail" class="subtitle"></p>
        <div class="summary"><div class="stat"><small>Status</small><b id="statusText">—</b></div><div class="stat"><small>Kuota Lagu</small><b id="quotaText">—</b></div><div class="stat"><small>Lagu Digunakan</small><b id="usedText">—</b></div></div>
      </section>
      <form id="detailForm">
        <section class="card section"><h2>Pengaturan Akun</h2><p class="help">Ubah identitas, kuota, dan status akun admin.</p><div class="fields"><label class="field">Nama admin<input id="displayName" required></label><label class="field">Email<input id="email" type="email" disabled></label><label class="field">Kuota lagu<input id="songQuota" type="number" min="0" required></label><label class="field">Status akun<select id="isActive" style="padding:12px;border:1px solid #2a3b35;border-radius:11px;background:#080c0b;color:#fff"><option value="true">Aktif</option><option value="false">Nonaktif</option></select></label></div></section>
        <section class="card section"><h2>Hak Akses</h2><p class="help">Pilih menu dan tindakan yang boleh digunakan admin ini.</p><div id="permissions" class="permissions"></div></section>
        <div id="message" class="notice hidden"></div><div class="actions"><a class="btn ghost" href="admin.html">Batal</a><button id="saveBtn" class="btn primary" type="submit">Simpan Perubahan</button></div>
      </form>
    </div>
  </main>
  <script>
    const DEFAULTS={view_dashboard:true,view_statistics:true,view_songs:true,add_song:true,edit_song:true,delete_song:true,publish_song:true};
    const LABELS={view_dashboard:['Beranda','Membuka dashboard dan ringkasan.'],view_statistics:['Statistik','Melihat statistik play dan download.'],view_songs:['Daftar Lagu','Melihat koleksi lagu miliknya.'],add_song:['Tambah Lagu','Mengunggah dan membuat lagu baru.'],edit_song:['Edit Lagu','Mengubah metadata, lirik, cover, dan audio.'],delete_song:['Hapus Lagu','Menghapus lagu miliknya.'],publish_song:['Publikasi Lagu','Mengubah lagu antara publik dan draft.']};
    const $=id=>document.getElementById(id);let db,adminId,profile;
    function fail(text){$('loading').classList.add('hidden');$('content').classList.add('hidden');$('error').textContent=text;$('error').classList.remove('hidden')}
    function showMessage(text,bad=false){$('message').textContent=text;$('message').classList.toggle('error',bad);$('message').classList.remove('hidden')}
    async function init(){
      adminId=new URLSearchParams(location.search).get('id');if(!adminId)return fail('ID admin tidak ditemukan.');
      const cfg=window.SUPABASE_CONFIG;if(!cfg||!window.supabase)return fail('Konfigurasi aplikasi tidak tersedia.');
      db=supabase.createClient(cfg.url,cfg.publishableKey,{auth:{storage:sessionStorage,persistSession:true,autoRefreshToken:true}});
      const {data:{session}}=await db.auth.getSession();if(!session){location.replace('admin.html');return}
      const {data:owner}=await db.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(owner?.role!=='super_admin')return fail('Halaman ini hanya dapat dibuka oleh Owner.');
      const [{data,error},{count}]=await Promise.all([db.from('profiles').select('*').eq('id',adminId).eq('role','editor').maybeSingle(),db.from('songs').select('id',{count:'exact',head:true}).eq('owner_id',adminId)]);
      if(error||!data)return fail(error?.message||'Data admin tidak ditemukan.');profile=data;render(count||0);
    }
    function render(used){
      const permissions={...DEFAULTS,...(profile.permissions||{})};$('adminName').textContent=profile.display_name||'Admin';$('adminEmail').textContent=profile.email||'Email belum tersedia';$('displayName').value=profile.display_name||'';$('email').value=profile.email||'';$('songQuota').value=profile.song_quota||0;$('isActive').value=String(profile.is_active);$('statusText').textContent=profile.is_active?'Aktif':'Nonaktif';$('quotaText').textContent=profile.song_quota||0;$('usedText').textContent=used;
      $('permissions').innerHTML=Object.entries(LABELS).map(([key,[label,help]])=>`<label class="permission"><input type="checkbox" data-permission="${key}" ${permissions[key]?'checked':''}><span><b>${label}</b><small>${help}</small></span></label>`).join('');$('loading').classList.add('hidden');$('content').classList.remove('hidden');
    }
    $('detailForm').onsubmit=async e=>{e.preventDefault();const quota=Number($('songQuota').value);if(!Number.isInteger(quota)||quota<0)return showMessage('Kuota harus berupa angka 0 atau lebih.',true);const permissions={};Object.keys(LABELS).forEach(key=>permissions[key]=!!document.querySelector(`[data-permission="${key}"]`)?.checked);$('saveBtn').disabled=true;const {error}=await db.from('profiles').update({display_name:$('displayName').value.trim(),song_quota:quota,is_active:$('isActive').value==='true',permissions}).eq('id',adminId);$('saveBtn').disabled=false;if(error)return showMessage(error.message,true);showMessage('Perubahan admin berhasil disimpan.');$('statusText').textContent=$('isActive').value==='true'?'Aktif':'Nonaktif';$('quotaText').textContent=quota};
    init();
  </script>
</body>
</html>
