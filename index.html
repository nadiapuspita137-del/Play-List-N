<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="favi.jpg" type="image/jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Play List Ngawi | Music Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        /* ===== GAYA SAMA (tidak diubah) ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; overflow-x: hidden; transition: background 0.3s, color 0.2s; }
        body.light { background: #f0f0f0; }
        body.light .glass-card { background: rgba(240, 240, 240, 0.7); border-color: rgba(255, 20, 147, 0.3); }
        body.light .glass-card:hover { border-color: #ff1493; }
        body.light .song-title, body.light .playlist-item .text-white { color: #1a1a1a; }
        body.light .playlist-item .text-gray-500 { color: #4a4a4a; }
        body.light .playlist-item.active { background: linear-gradient(90deg, rgba(255,20,147,0.2), transparent); border-left-color: #ff1493; }
        .glass-card { background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(0, 255, 136, 0.2); border-radius: 2rem; transition: all 0.3s; }
        body.light .glass-card { background: rgba(240, 240, 240, 0.8); backdrop-filter: blur(20px); }
        .paint-splash { position: fixed; pointer-events: none; z-index: 0; }
        .splash-1 { top: 10%; left: -5%; width: 300px; height: 300px; background: radial-gradient(circle, rgba(0,255,136,0.2) 0%, transparent 70%); animation: float 8s ease-in-out infinite; }
        .splash-2 { bottom: 5%; right: -5%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(255,20,147,0.2) 0%, transparent 70%); animation: float 10s ease-in-out infinite reverse; }
        .splash-3 { top: 40%; right: 15%; width: 200px; height: 200px; background: radial-gradient(circle, rgba(0,255,255,0.15) 0%, transparent 70%); animation: float 7s ease-in-out infinite 2s; }
        .splash-4 { bottom: 20%; left: 10%; width: 250px; height: 250px; background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%); animation: float 9s ease-in-out infinite 1s; }
        .grunge-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.03"/></svg>'); pointer-events: none; z-index: 1; }
        .progress-bar { transition: width 0.1s linear; pointer-events: none; }
        #progressContainer {
            position: relative;
            height: 20px;
            overflow: visible;
            cursor: pointer;
            touch-action: none;
            user-select: none;
        }
        #progressContainer::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 6px;
            transform: translateY(-50%);
            border-radius: 999px;
            background: #1f2937;
        }
        #progressFill {
            top: 50%;
            height: 6px;
            transform: translateY(-50%);
        }
        #progressThumb {
            position: absolute;
            top: 50%;
            left: 0%;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid #00c96b;
            box-shadow: 0 0 0 3px rgba(0,255,136,.16);
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity .15s ease;
        }
        #progressContainer:hover #progressThumb,
        #progressContainer:focus-visible #progressThumb,
        #progressContainer.is-seeking #progressThumb { opacity: 1; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #ff1493; border-radius: 10px; }
        .playlist-item { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 1rem; }
        .playlist-item:hover { transform: translateX(8px); background: rgba(0, 255, 136, 0.1); }
        .playlist-item.active { background: linear-gradient(90deg, rgba(0,255,136,0.2), transparent); border-left: 3px solid #00ff88; }
        body.light .playlist-item.active { background: linear-gradient(90deg, rgba(255,20,147,0.2), transparent); border-left-color: #ff1493; }
        .btn-glow { transition: all 0.3s ease; }
        .btn-glow:hover { filter: drop-shadow(0 0 8px #ff1493); transform: scale(1.05); }
        .cover-art.playing { animation: float 3s ease-in-out infinite; box-shadow: 0 0 30px rgba(255,20,147,0.5); }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(255,20,147,0.2); border-top-color: #ff1493; border-radius: 50%; animation: spin 0.8s linear infinite; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; visibility: hidden; opacity: 0; transition: all 0.2s; }
        .modal.active { visibility: visible; opacity: 1; }
        .modal-content { background: #111; border-radius: 2rem; padding: 1.5rem; width: 90%; max-width: 400px; border: 1px solid #ff1493; }
        body.light .modal-content { background: #fff; border-color: #ff1493; }
        .sleep-badge { position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 6px 12px; border-radius: 30px; font-size: 12px; color: #ff1493; z-index: 50; font-weight: bold; }
        .playlist-tab { transition: all 0.2s; border-radius: 30px; padding: 4px 12px; cursor: pointer; background: rgba(255,255,255,0.05); display: inline-flex; align-items: center; gap: 6px; }
        .playlist-tab.active { background: #ff1493; color: white; }
        body.light .playlist-tab.active { background: #ff1493; color: white; }
        .delete-playlist-btn { opacity: 0.6; transition: opacity 0.2s; font-size: 12px; cursor: pointer; }
        .delete-playlist-btn:hover { opacity: 1; color: #ff4444; }
        .add-to-playlist-btn { transition: all 0.2s; }
        .add-to-playlist-btn:hover { transform: scale(1.1); color: #00ff88 !important; }
        .download-song-btn { transition: all 0.2s; }
        .download-song-btn:hover { transform: translateY(-1px) scale(1.08); color: #ff1493 !important; }
        .download-song-btn:disabled { cursor: wait; opacity: .65; transform: none; }
        .lyrics-live { min-height: 54px; display:grid; place-items:center; text-align:center; padding:10px; border-radius:14px; background:rgba(0,255,136,.06); color:#9ca3af; transition:.25s; }
        .lyrics-live.has-line { color:#fff; border:1px solid rgba(0,255,136,.22); text-shadow:0 0 16px rgba(0,255,136,.35); }
        .audio-status { display:flex; align-items:center; justify-content:center; gap:7px; min-height:25px; color:#87938f; font-size:11px; font-weight:700; letter-spacing:.04em; }
        .audio-status.loading { color:#ff56ad; }
        .audio-status.ready { color:#00df7c; }
        .audio-status.error { color:#ff6872; }
        .audio-status .status-spinner { width:12px; height:12px; border:2px solid rgba(255,86,173,.25); border-top-color:#ff56ad; border-radius:50%; animation:spin .65s linear infinite; }
        #waveformCanvas { width:100%; height:62px; display:block; border-radius:12px; background:rgba(255,255,255,.025); cursor:pointer; }

        /* Penyempurnaan UX, responsif, dan aksesibilitas */
        button, input { -webkit-tap-highlight-color: transparent; }
        button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
            outline: 2px solid #00ff88; outline-offset: 3px;
        }
        .brand-mark { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(135deg, #00ff88, #ff1493); color: #090909; box-shadow: 0 10px 30px rgba(0,255,136,.18); }
        .eyebrow { color: #00ff88; letter-spacing: .18em; text-transform: uppercase; font-size: .68rem; font-weight: 800; }
        .status-pill { border: 1px solid rgba(0,255,136,.25); background: rgba(0,255,136,.08); }
        .shortcut-key { border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); border-radius: .4rem; padding: .1rem .4rem; }
        body.light .eyebrow { color: #d20b75; }
        body.light .status-pill { border-color: rgba(210,11,117,.25); background: rgba(210,11,117,.08); color: #333; }
        body.light input { color: #171717 !important; background: rgba(255,255,255,.75) !important; }
        body.light .modal-content h3, body.light .modal-content { color: #171717; }
        @media (max-width: 767px) {
            .glass-card { border-radius: 1.25rem; padding: 1rem !important; }
            .app-shell { padding: .75rem !important; align-items: flex-start !important; }
            .toolbar { align-items: stretch !important; }
            .toolbar .search-wrap { width: 100%; }
            .toolbar .search-wrap input { width: 100%; }
            .player-controls { gap: .65rem !important; }
            .playlist-item { gap: .7rem !important; padding: .7rem !important; }
            .playlist-item:hover { transform: none; }
            #playlistContainer { max-height: 46vh; }
            .desktop-hint { display: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
        }
    </style>
</head>
<body class="relative overflow-x-hidden">
    <!-- Splash background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="splash-1 paint-splash rounded-full blur-3xl"></div>
        <div class="splash-2 paint-splash rounded-full blur-3xl"></div>
        <div class="splash-3 paint-splash rounded-full blur-3xl"></div>
        <div class="splash-4 paint-splash rounded-full blur-3xl"></div>
    </div>
    <div class="grunge-overlay"></div>

    <div id="sleepBadge" class="sleep-badge hidden"></div>

    <div class="app-shell relative z-10 min-h-screen flex items-center justify-center p-4 md:p-8">
        <div class="container mx-auto max-w-7xl">
            <div class="glass-card rounded-3xl p-6 md:p-8 shadow-2xl">
                <header class="flex items-center justify-between gap-4 mb-6">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="brand-mark flex-shrink-0" aria-hidden="true"><i class="fas fa-wave-square"></i></div>
                        <div class="min-w-0">
                            <div class="eyebrow">Music player</div>
                            <h1 class="text-xl md:text-2xl font-extrabold text-white song-title truncate">Play List Ngawi</h1>
                        </div>
                    </div>
                    <div class="status-pill rounded-full px-3 py-2 text-xs text-gray-300 whitespace-nowrap">
                        <i class="fas fa-headphones mr-1 text-green-400"></i><span id="libraryCount">0 lagu</span>
                    </div>
                </header>
                <div class="toolbar flex justify-between items-center mb-4 flex-wrap gap-3">
                    <div class="flex gap-2">
                        <button id="darkModeToggle" class="btn-glow bg-gray-800/50 text-white p-2 rounded-full w-10 h-10 flex items-center justify-center"><i class="fas fa-moon"></i></button>
                        <button id="sleepTimerBtn" class="btn-glow bg-gray-800/50 text-white p-2 rounded-full w-10 h-10 flex items-center justify-center"><i class="fas fa-hourglass-half"></i></button>
                        <button id="createPlaylistBtn" class="btn-glow bg-gray-800/50 text-white p-2 rounded-full w-10 h-10 flex items-center justify-center"><i class="fas fa-plus"></i></button>
                        <button id="resetPlaylistBtn" class="btn-glow bg-gray-800/50 text-white p-2 rounded-full w-10 h-10 flex items-center justify-center" title="Reset ke Playlist Default (semua lagu)"><i class="fas fa-undo-alt"></i></button>
                    </div>
                    <div class="search-wrap relative">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                        <input type="text" id="searchInput" placeholder="Cari lagu..." class="bg-gray-800/50 text-white rounded-full py-2 pl-9 pr-4 text-sm outline-none focus:ring-1 focus:ring-green-500 w-48">
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <!-- LEFT SECTION -->
                    <div class="lg:col-span-1 space-y-6">
                        <div class="relative group">
                            <div class="cover-art rounded-2xl overflow-hidden shadow-2xl">
                                <img id="coverArt" src="https://placehold.co/400/1a1a1a/00ff88?text=🎵" alt="Cover" class="w-full aspect-square object-cover">
                            </div>
                            <div id="playingIndicator" class="absolute top-4 right-4 w-3 h-3 bg-green-500 rounded-full animate-pulse hidden"></div>
                        </div>
                        <div class="text-center space-y-2" id="songInfo">
                            <h2 id="songTitle" class="text-2xl md:text-3xl font-bold text-white song-title">Zombie Anthem</h2>
                            <p id="songArtist" class="text-gray-400 text-sm md:text-base">The Undead</p>
                        </div>
                        <div id="lyricsLive" class="lyrics-live text-sm">Lirik akan tampil di sini</div>
                        <div id="audioStatus" class="audio-status" role="status" aria-live="polite"><i class="fas fa-circle text-[6px]"></i><span>Siap memilih lagu</span></div>
                        <canvas id="waveformCanvas" width="640" height="124" aria-label="Waveform lagu, klik untuk berpindah waktu"></canvas>
                        <div class="space-y-2">
                            <div id="progressContainer" role="slider" tabindex="0" aria-label="Posisi lagu" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0:00 dari 0:00">
                                <div id="progressFill" class="progress-bar absolute left-0 bg-gradient-to-r from-green-500 to-red-500 rounded-full" style="width: 0%"></div>
                                <div id="progressThumb" aria-hidden="true"></div>
                            </div>
                            <div class="flex justify-between text-xs text-gray-500">
                                <span id="currentTime">0:00</span>
                                <span id="duration">0:00</span>
                            </div>
                        </div>
                        <div class="player-controls flex items-center justify-center gap-4 md:gap-6">
                            <button id="shuffleBtn" class="btn-glow w-10 h-10 rounded-full bg-gray-800/50 text-gray-400"><i class="fas fa-random"></i></button>
                            <button id="prevBtn" class="btn-glow w-12 h-12 rounded-full bg-gray-800/50 text-white"><i class="fas fa-backward-step text-lg"></i></button>
                            <button id="playBtn" class="btn-glow w-16 h-16 rounded-full bg-gradient-to-br from-green-500 to-red-500 text-white shadow-lg"><i class="fas fa-play text-2xl"></i></button>
                            <button id="nextBtn" class="btn-glow w-12 h-12 rounded-full bg-gray-800/50 text-white"><i class="fas fa-forward-step text-lg"></i></button>
                            <button id="repeatBtn" class="btn-glow w-10 h-10 rounded-full bg-gray-800/50 text-gray-400"><i class="fas fa-repeat"></i></button>
                        </div>
                        <div class="flex items-center gap-3 px-2">
                            <button id="muteBtn" class="text-gray-400 text-sm w-6" aria-label="Bisukan suara"><i class="fas fa-volume-up"></i></button>
                            <input type="range" id="volumeSlider" aria-label="Volume" min="0" max="1" step="0.01" value="0.7" class="flex-1 h-1 bg-gray-800 rounded-lg cursor-pointer">
                        </div>
                    </div>

                    <!-- RIGHT SECTION -->
                    <div class="lg:col-span-2">
                        <div class="flex flex-wrap items-center justify-between mb-3 gap-2">
                            <div class="flex flex-wrap gap-2" id="playlistTabsContainer"></div>
                            <div class="text-xs text-gray-500" id="songCount">0 Lagu</div>
                        </div>
                        <div class="space-y-2 max-h-[400px] md:max-h-[500px] overflow-y-auto pr-2" id="playlistContainer" aria-live="polite"></div>
                        <div class="desktop-hint mt-4 text-center text-[11px] text-gray-600">
                            <span class="shortcut-key">Space</span> putar/jeda &nbsp; <span class="shortcut-key">←</span><span class="shortcut-key">→</span> pindah lagu &nbsp; <span class="shortcut-key">M</span> bisukan
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="loading-spinner"></div>
    </div>

    <!-- Modal Sleep Timer -->
    <div id="sleepModal" class="modal">
        <div class="modal-content">
            <h3 class="text-xl font-bold mb-3 text-white">Sleep Timer</h3>
            <div class="grid grid-cols-2 gap-2">
                <button class="sleep-option bg-gray-700 p-2 rounded-lg" data-minutes="1">1 menit</button>
                <button class="sleep-option bg-gray-700 p-2 rounded-lg" data-minutes="5">5 menit</button>
                <button class="sleep-option bg-gray-700 p-2 rounded-lg" data-minutes="10">10 menit</button>
                <button class="sleep-option bg-gray-700 p-2 rounded-lg" data-minutes="15">15 menit</button>
                <button class="sleep-option bg-gray-700 p-2 rounded-lg" data-minutes="30">30 menit</button>
                <button id="cancelSleep" class="bg-red-500 p-2 rounded-lg">Batal</button>
            </div>
        </div>
    </div>

    <!-- Modal Create Playlist -->
    <div id="createPlaylistModal" class="modal">
        <div class="modal-content">
            <h3 class="text-xl font-bold mb-3 text-white">Buat Playlist Baru</h3>
            <input type="text" id="newPlaylistName" placeholder="Nama playlist" class="w-full p-2 rounded-lg bg-gray-800 text-white mb-3">
            <div class="flex gap-2">
                <button id="confirmCreatePlaylist" class="bg-green-500 p-2 rounded-lg flex-1">Buat</button>
                <button id="cancelCreatePlaylist" class="bg-gray-500 p-2 rounded-lg flex-1">Batal</button>
            </div>
        </div>
    </div>

    <!-- Modal Pilih Playlist -->
    <div id="selectPlaylistModal" class="modal">
        <div class="modal-content">
            <h3 class="text-xl font-bold mb-3 text-white">Pilih Playlist</h3>
            <div id="playlistListContainer" class="space-y-2 max-h-60 overflow-y-auto mb-3"></div>
            <div class="flex gap-2">
                <button id="cancelSelectPlaylist" class="bg-gray-500 p-2 rounded-lg flex-1">Batal</button>
            </div>
        </div>
    </div>

        // ========== PERBAIKAN AUTO-PLAY NEXT ==========
        const assembledSongUrls = new Map();
        async function resolveSongUrl(song) {
            if (song.url) {
                const safeUrl = safeMediaUrl(song.url);
                if (!safeUrl) throw new Error('URL audio tidak valid');
                return safeUrl;
            }
            if (assembledSongUrls.has(song.id)) return assembledSongUrls.get(song.id);
            const parts = song.parts?.map(part => safeMediaUrl(part)) || [];
            if (!parts.length || parts.some(part => !part)) throw new Error('URL bagian audio tidak valid');
            const responses = await Promise.all(parts.map(part => fetch(part)));
            if (responses.some(response => !response.ok)) throw new Error('Bagian audio tidak lengkap');
            const chunks = await Promise.all(responses.map(response => response.arrayBuffer()));
            const objectUrl = URL.createObjectURL(new Blob(chunks, { type: 'audio/mpeg' }));
            assembledSongUrls.set(song.id, objectUrl);
            return objectUrl;
        }

        async function downloadSong(songId, button) {
            const song = getSongById(songId);
            if (!song || button.disabled) return;
            button.disabled = true;
            button.replaceChildren(createIcon('fas fa-spinner fa-spin'));
            button.setAttribute('aria-label', `Menyiapkan download ${song.title}`);
            try {
                const sourceUrl = await resolveSongUrl(song);
                const response = await fetch(sourceUrl);
                if (!response.ok) throw new Error('File tidak dapat diunduh');
                const blob = await response.blob();
                const downloadUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = `${song.title.replace(/[\\/:*?"<>|]/g, '-').trim()}.mp3`;
                document.body.appendChild(link);
                link.click();
                recordEvent(song.id,'download');
                link.remove();
                setTimeout(() => URL.revokeObjectURL(downloadUrl), 1500);
                button.replaceChildren(createIcon('fas fa-check text-green-500'));
                setTimeout(() => { button.replaceChildren(createIcon('fas fa-download')); }, 1600);
            } catch (error) {
                console.error('Download error:', error);
                button.replaceChildren(createIcon('fas fa-triangle-exclamation text-red-500'));
                alert(`Gagal mengunduh ${song.title}. Coba lagi.`);
                setTimeout(() => { button.replaceChildren(createIcon('fas fa-download')); }, 1600);
            } finally {
                button.disabled = false;
                button.setAttribute('aria-label', `Download ${song.title}`);
            }
        }

        async function loadSongById(songId, autoplay = isPlaying) {
            const song = getSongById(songId);
            if (!song) return;
            // Simpan niat memutar sebelum audio.pause() memicu event pause.
            const shouldAutoplay = Boolean(autoplay);
            const needsAssembly = Boolean(song.parts?.length && !assembledSongUrls.has(song.id));
            if (needsAssembly) showLoading();
            setAudioStatus('loading', needsAssembly ? 'Menyatukan file lagu…' : 'Menyiapkan lagu…');
            audio.pause();
            songTitle.textContent = song.title;
            songArtist.textContent = song.artist;
            coverArt.src = safeMediaUrl(song.cover, 'favi.jpg');
            activeLyrics = parseLrc(song.lyrics_lrc || '');
            updateLyrics();
            progressFill.style.width = '0%';
            currentTimeSpan.textContent = '0:00';
            durationSpan.textContent = song.duration || '--:--';
            try {
                audio.src = await resolveSongUrl(song);
            } catch (error) {
                hideLoading();
                console.error(`Gagal memuat ${song.title}:`, error);
                lyricsLive.textContent = `File ${song.title} tidak dapat dimuat`;
                lyricsLive.classList.remove('has-line');
                setAudioStatus('error', 'Lagu gagal dimuat');
                isPlaying = false;
                updatePlayButtonUI(false);
                return;
            }
            hideLoading();
            audio.preload = 'metadata';
            audio.load();
            drawWaveform(song,audio.src);
            if (shouldAutoplay) {
                audio.play().then(() => {
                    isPlaying = true;
                    updatePlayButtonUI(true);
                    setAudioStatus('ready', 'Sedang diputar');
                }).catch(err => {
                    console.log('Streaming belum siap:', err);
                    isPlaying = false;
                    updatePlayButtonUI(false);
                    setAudioStatus('error', 'Belum dapat diputar');
                });
            } else {
                updatePlayButtonUI(false);
            }
            audio.onloadedmetadata = () => {
                if (Number.isFinite(audio.duration)) {
                    const measured=formatTime(audio.duration),current=getSongById(currentPlayingSongId);
                    durationSpan.textContent=measured;
                    if(current&&current.duration!==measured){current.duration=measured;refreshPlaylistView()}
                }
                if (!isPlaying) setAudioStatus('ready', 'Siap diputar');
            };
            audio.onerror = () => { 
                hideLoading(); 
                console.error(`File audio ${song.title} tidak tersedia`);
                lyricsLive.textContent = `File ${song.title} tidak tersedia`;
                lyricsLive.classList.remove('has-line');
                setAudioStatus('error', 'File audio tidak tersedia');
                isPlaying = false;
                updatePlayButtonUI(false);
            };
            renderPlaylistTabs();
            refreshPlaylistView();
        }

            }

        function nextSong(autoplay = isPlaying) {
            const songs = getCurrentDisplaySongs();
            if (songs.length === 0) return;
            let newIndex;
            if (isShuffle) {
                do { newIndex = Math.floor(Math.random() * songs.length); } while (newIndex === currentSongIndexInFiltered && songs.length > 1);
            } else {
                newIndex = (currentSongIndexInFiltered + 1) % songs.length;
            }
            currentSongIndexInFiltered = newIndex;
            currentPlayingSongId = songs[newIndex].id;
            loadSongById(currentPlayingSongId, autoplay);
        }

        function prevSong() {
            if (audio.currentTime > 3) { audio.currentTime = 0; return; }
            const songs = getCurrentDisplaySongs();
            if (songs.length === 0) return;
            let newIndex = (currentSongIndexInFiltered - 1 + songs.length) % songs.length;
            currentSongIndexInFiltered = newIndex;
            currentPlayingSongId = songs[newIndex].id;
            loadSongById(currentPlayingSongId);
        }

        function updateProgress() {
            if (audio.duration && !isNaN(audio.duration)) {
                const percent = Math.min(100, Math.max(0, (audio.currentTime / audio.duration) * 100));
                progressFill.style.width = `${percent}%`;
                progressThumb.style.left = `${percent}%`;
                currentTimeSpan.textContent = formatTime(audio.currentTime);
                progressContainer.setAttribute('aria-valuenow', Math.round(percent));
                progressContainer.setAttribute('aria-valuetext', `${formatTime(audio.currentTime)} dari ${formatTime(audio.duration)}`);
            }
        }

        // Storage & Playlist management
        function savePlaylistsToLocal() {
            localStorage.setItem('y2k_playlists', JSON.stringify(playlists));
            localStorage.setItem('currentPlaylistId', currentPlaylistId);
        }
        function loadPlaylistsFromLocal() {
            const saved = localStorage.getItem('y2k_playlists');
            if (saved) {
                playlists = JSON.parse(saved);
                const defaultPlaylist = playlists.find(p => p.name === "Playlist Utama" || p.id === 1);
                if (defaultPlaylist) defaultPlaylist.permanent = true;
                playlists.forEach(p => { if (p.name !== "Playlist Utama" && p.id !== 1) p.permanent = false; });
            } else {
                const defaultId = Date.now();
                playlists = [{ id: defaultId, name: "Playlist Utama", songIds: masterSongs.map(s => s.id), permanent: true }];
            }
            const savedId = localStorage.getItem('currentPlaylistId');
            if (savedId && playlists.find(p => p.id == savedId)) currentPlaylistId = parseInt(savedId);
            else currentPlaylistId = playlists[0].id;
            
            syncPermanentPlaylistWithMaster();
        }
        
        function addPlaylist(name) {
            const newId = Date.now();
            playlists.push({ id: newId, name: name, songIds: [], permanent: false });
            currentPlaylistId = newId;
            savePlaylistsToLocal();
            renderPlaylistTabs();
            refreshPlaylistView();
            currentPlayingSongId = null;
            audio.pause();
            isPlaying = false;
            updatePlayButtonUI(false);
        }

        function resetToDefault() {
            if (confirm("Reset semua playlist ke default? Semua playlist tambahan akan hilang.")) {
                const defaultId = Date.now();
                playlists = [{ id: defaultId, name: "Playlist Utama", songIds: masterSongs.map(s => s.id), permanent: true }];
                currentPlaylistId = defaultId;
                currentPlayingSongId = null;
                isPlaying = false;
                audio.pause();
                updatePlayButtonUI(false);
                savePlaylistsToLocal();
                renderPlaylistTabs();
                refreshPlaylistView();
                const firstSongs = getCurrentDisplaySongs();
                if (firstSongs.length) {
                    currentPlayingSongId = firstSongs[0].id;
                    currentSongIndexInFiltered = 0;
                    loadSongById(currentPlayingSongId);
                }
                alert("Playlist telah direset ke default (semua lagu).");
            }
        }

        // Sleep timer
        function startSleepTimer(minutes) {
            if (sleepTimeout) clearTimeout(sleepTimeout);
            const badge = document.getElementById('sleepBadge');
            badge.classList.remove('hidden');
            badge.replaceChildren(createIcon('fas fa-bed mr-1'), document.createTextNode(` Tidur dalam ${Number(minutes)} menit`));
            sleepTimeout = setTimeout(() => {
                audio.pause();
                isPlaying = false;
                updatePlayButtonUI(false);
                badge.classList.add('hidden');
                alert("Sleep timer: musik dihentikan.");
                if (sleepTimeout) clearTimeout(sleepTimeout);
            }, minutes * 60 * 1000);
        }
        function cancelSleepTimer() {
            if (sleepTimeout) clearTimeout(sleepTimeout);
            document.getElementById('sleepBadge').classList.add('hidden');
        }

        // Tema tersimpan
        const darkToggle = document.getElementById('darkModeToggle');
        if (localStorage.getItem('playlist_theme') === 'light') {
            document.body.classList.add('light');
            darkToggle.querySelector('i').className = 'fas fa-sun';
        }
        darkToggle.addEventListener('click', () => {
            document.body.classList.toggle('light');
            localStorage.setItem('playlist_theme', document.body.classList.contains('light') ? 'light' : 'dark');
            const icon = darkToggle.querySelector('i');
            if (document.body.classList.contains('light')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        });

        // Event listeners
        playBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', nextSong);
        prevBtn.addEventListener('click', prevSong);
        shuffleBtn.addEventListener('click', () => { isShuffle = !isShuffle; shuffleBtn.style.color = isShuffle ? '#ff1493' : '#9ca3af'; });
        repeatBtn.addEventListener('click', () => { isRepeat = !isRepeat; repeatBtn.style.color = isRepeat ? '#ff1493' : '#9ca3af'; audio.loop = isRepeat; });
        volumeSlider.addEventListener('input', (e) => {
            audio.volume = parseFloat(e.target.value);
            audio.muted = false;
            updateMuteUI();
        });
        function updateMuteUI() {
            const icon = muteBtn.querySelector('i');
            icon.className = audio.muted || audio.volume === 0 ? 'fas fa-volume-xmark' : (audio.volume < .5 ? 'fas fa-volume-low' : 'fas fa-volume-high');
            muteBtn.setAttribute('aria-label', audio.muted ? 'Aktifkan suara' : 'Bisukan suara');
        }
        muteBtn.addEventListener('click', () => { audio.muted = !audio.muted; updateMuteUI(); });
        const progressThumb = document.getElementById('progressThumb');
        let isSeeking = false;

        function seekFromClientX(clientX) {
            if (!audio.duration || !Number.isFinite(audio.duration)) return;
            const rect = progressContainer.getBoundingClientRect();
            const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
            audio.currentTime = ratio * audio.duration;
            updateProgress();
        }

        progressContainer.addEventListener('pointerdown', (e) => {
            isSeeking = true;
            progressContainer.classList.add('is-seeking');
            progressContainer.setPointerCapture?.(e.pointerId);
            seekFromClientX(e.clientX);
        });
        progressContainer.addEventListener('pointermove', (e) => {
            if (isSeeking) seekFromClientX(e.clientX);
        });
        function finishSeeking(e) {
            if (!isSeeking) return;
            seekFromClientX(e.clientX);
            isSeeking = false;
            progressContainer.classList.remove('is-seeking');
            if (progressContainer.hasPointerCapture?.(e.pointerId)) progressContainer.releasePointerCapture(e.pointerId);
        }
        progressContainer.addEventListener('pointerup', finishSeeking);
        progressContainer.addEventListener('pointercancel', () => {
            isSeeking = false;
            progressContainer.classList.remove('is-seeking');
        });
        progressContainer.addEventListener('keydown', (e) => {
            if (!audio.duration || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
            e.preventDefault();
            if (e.key === 'Home') audio.currentTime = 0;
            else if (e.key === 'End') audio.currentTime = audio.duration;
            else audio.currentTime = Math.min(audio.duration, Math.max(0, audio.currentTime + (e.key === 'ArrowRight' ? 5 : -5)));
            updateProgress();
        });
        audio.addEventListener('timeupdate', () => { updateProgress(); updateLyrics(); });
        
        // ========== PERBAIKAN ENDED EVENT ==========
        audio.addEventListener('ended', () => {
            if (isRepeat) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Repeat play error:", e));
            } else {
                // Tetap putar walau event pause dari lagu lama sudah terjadi.
                nextSong(true);
            }
        });
        
        audio.addEventListener('loadstart', () => setAudioStatus('loading', 'Memuat audio…'));
        audio.addEventListener('waiting', () => setAudioStatus('loading', 'Buffering…'));
        audio.addEventListener('stalled', () => setAudioStatus('loading', 'Koneksi audio melambat…'));
        audio.addEventListener('canplay', () => { if (!isPlaying) setAudioStatus('ready', 'Siap diputar'); });
        const playedThisSession=new Set();
        audio.addEventListener('playing', () => {setAudioStatus('ready', 'Sedang diputar');if(currentPlayingSongId&&!playedThisSession.has(currentPlayingSongId)){playedThisSession.add(currentPlayingSongId);recordEvent(currentPlayingSongId,'play')}});
        audio.addEventListener('play', () => { isPlaying=true; updatePlayButtonUI(true); refreshPlaylistView(); });
        audio.addEventListener('pause', () => { isPlaying=false; updatePlayButtonUI(false); if(audio.currentTime>0&&!audio.ended)setAudioStatus('', 'Dijeda'); refreshPlaylistView(); });
        searchInput.addEventListener('input', () => { refreshPlaylistView(); });
        
        document.getElementById('sleepTimerBtn').addEventListener('click', () => { sleepModal.classList.add('active'); });
        document.querySelectorAll('.sleep-option').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const mins = parseInt(e.target.dataset.minutes);
                startSleepTimer(mins);
                sleepModal.classList.remove('active');
            });
        });
        document.getElementById('cancelSleep').addEventListener('click', () => { cancelSleepTimer(); sleepModal.classList.remove('active'); });
        sleepModal.addEventListener('click', (e) => { if(e.target === sleepModal) sleepModal.classList.remove('active'); });
        
        document.getElementById('createPlaylistBtn').addEventListener('click', () => { createPlaylistModal.classList.add('active'); });
        document.getElementById('confirmCreatePlaylist').addEventListener('click', () => {
            const name = document.getElementById('newPlaylistName').value.trim();
            if(name) addPlaylist(name);
            createPlaylistModal.classList.remove('active');
            document.getElementById('newPlaylistName').value = '';
        });
        document.getElementById('cancelCreatePlaylist').addEventListener('click', () => { createPlaylistModal.classList.remove('active'); });
        createPlaylistModal.addEventListener('click', (e) => { if(e.target === createPlaylistModal) createPlaylistModal.classList.remove('active'); });

        cancelSelectPlaylist.addEventListener('click', () => { selectPlaylistModal.classList.remove('active'); });
        selectPlaylistModal.addEventListener('click', (e) => { if(e.target === selectPlaylistModal) selectPlaylistModal.classList.remove('active'); });
        
        document.getElementById('resetPlaylistBtn').addEventListener('click', resetToDefault);

        // Kontrol keyboard, tombol modal, dan integrasi perangkat
        document.querySelectorAll('button').forEach(btn => {
            if (!btn.getAttribute('aria-label') && btn.title) btn.setAttribute('aria-label', btn.title);
        });
        document.addEventListener('keydown', (e) => {
            const focusedElement = document.activeElement;
            const typing = ['INPUT', 'TEXTAREA'].includes(focusedElement.tagName);
            const usingProgressBar = focusedElement === progressContainer;
            if (e.key === 'Escape') document.querySelectorAll('.modal.active').forEach(modal => modal.classList.remove('active'));
            if (typing || usingProgressBar || e.defaultPrevented) return;
            if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
            if (e.key === 'ArrowRight') nextSong();
            if (e.key === 'ArrowLeft') prevSong();
            if (e.key.toLowerCase() === 'm') { audio.muted = !audio.muted; updateMuteUI(); }
        });
        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', togglePlay);
            navigator.mediaSession.setActionHandler('pause', togglePlay);
            navigator.mediaSession.setActionHandler('nexttrack', nextSong);
            navigator.mediaSession.setActionHandler('previoustrack', prevSong);
        }

        async function initializeApp() {
            await loadRemoteSongs();
            libraryCount.textContent = `${masterSongs.length} lagu`;
            loadPlaylistsFromLocal();
            renderPlaylistTabs(); refreshPlaylistView();
            const firstSongs=getCurrentDisplaySongs();
            if(firstSongs.length){currentPlayingSongId=firstSongs[0].id;currentSongIndexInFiltered=0;loadSongById(currentPlayingSongId)}
            audio.volume=.7; updateMuteUI();
        }
        initializeApp();
    </script>
</body>
</html>
